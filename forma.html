<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>FORMA · Personal Training System</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--brand:var(--bl);--onbrand:#04101c;--onbl:#04101c;--onrd:#fff;--onvi:#fff;--onam:#1a1100;--dgr:#ff6b84;--shd:#000a;--scrim:#000b;--g1:#3a0f4acc;--g2:#0b2a4acc;--glass:color-mix(in srgb,var(--bg) 90%,transparent);--dim:color-mix(in srgb,var(--tx) 82%,var(--bg));--hov:color-mix(in srgb,var(--tx) 6%,transparent);--onac:var(--onbrand);--bg:#07060f;--sf:#0f0d20;--sf2:#171433;--sf3:#211d47;--ln:#28234f;--ln2:#373069;--tx:#eeedff;--mu:#9a97c4;--rd:#ff3358;--bl:#33aaff;--vi:#8d6bff;--gn:#3be0a4;--am:#ffb84a;--ac:var(--brand);--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.c-pull{--ac:var(--bl);--onac:var(--onbl)}.c-push{--ac:var(--rd);--onac:var(--onrd)}.c-legs{--ac:var(--vi);--onac:var(--onvi)}
html{scroll-padding-top:70px}
body{margin:0;color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;background:var(--bg);background-image:linear-gradient(color-mix(in srgb,var(--tx) 3%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--tx) 3%,transparent) 1px,transparent 1px),radial-gradient(700px 380px at 95% -5%,var(--g1),transparent 65%),radial-gradient(600px 320px at 0 6%,var(--g2),transparent 60%);background-size:36px 36px,36px 36px,auto,auto;background-attachment:fixed;font-variant-numeric:tabular-nums}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,b,.hd{font-family:'Chakra Petch',sans-serif}
h2,h3,h4{margin:0}button{font-family:inherit;color:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:6;background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.hin{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--rd),var(--vi) 55%,var(--bl));display:grid;place-items:center;color:var(--onrd);flex:none}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border:1px solid var(--ln2);background:var(--sf2);border-radius:99px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--gn)}.chip.warn i{background:var(--am)}.chip.bad i{background:var(--dgr)}.chip.warn{border-color:color-mix(in srgb,var(--am) 45%,transparent)}.chip.bad{border-color:color-mix(in srgb,var(--dgr) 55%,transparent)}
.wrap{max-width:820px;margin:0 auto;padding:14px 14px calc(150px + env(safe-area-inset-bottom,0px))}
.card{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--tx) 3%,transparent),transparent),var(--sf);border:1px solid var(--ln);border-radius:var(--r)}
.pad{padding:16px}.meta{color:var(--mu);font-size:13px}.note{color:var(--mu);font-size:13px;margin:10px 2px 14px}
.pg{font-size:24px;margin:4px 0 14px;letter-spacing:.01em}.sec{margin:22px 2px 10px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.empty{color:var(--mu);font-size:14px}
/* week + day */
.wks{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}

.ring{position:relative;width:72px;height:72px;flex:0 0 72px}.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}.rb{stroke:var(--sf3)}.rf{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.hst{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.hst span,.chips span{font-size:12px;color:var(--mu);background:var(--hov);border:1px solid var(--ln);padding:2px 9px;border-radius:99px;display:inline-flex;gap:5px;align-items:center}

.ch{display:flex;gap:12px;align-items:center;padding:14px 8px 6px 14px}
.ck{width:44px;height:44px;flex:0 0 44px;border:2px solid var(--ln2);border-radius:12px;background:var(--sf2);color:var(--onac);cursor:pointer;display:grid;place-items:center;padding:0;transition:background .18s,border-color .18s,transform .12s}

.ck.on{background:var(--ac);border-color:var(--ac)}.ck.on .ic{transform:scale(1)}.ck:active{transform:scale(.92)}
.ck.lg{width:34px;height:34px;flex-basis:34px;border-radius:10px}.ck.lg .ic{width:18px;height:18px}
@media(prefers-reduced-motion:no-preference){.ck.pop{animation:pop .4s}@keyframes pop{40%{transform:scale(1.18);box-shadow:0 0 0 8px color-mix(in srgb,var(--ac) 30%,transparent)}}.sr.d{animation:flash .5s}@keyframes flash{0%{background:color-mix(in srgb,var(--ac) 28%,transparent)}}}
.ch .t{flex:1;min-width:0}.ch h3{font-size:16px;line-height:1.25}.tag{font:600 10px Inter;color:var(--am);border:1px solid color-mix(in srgb,var(--am) 35%,transparent);border-radius:99px;padding:1px 6px;margin-left:6px;vertical-align:2px;font-style:normal}
.ib{background:none;border:0;color:var(--mu);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}.ib:hover{background:var(--hov);color:var(--tx)}.ib:disabled{opacity:.25;cursor:default}.ib.dng{color:var(--dgr)}.ib.sm{width:34px;height:34px}
.last{margin:0 14px 8px;font-size:12px;color:var(--brand)}
.det{display:none;margin:0 14px 8px;padding:8px 0;color:var(--dim);font-size:14px;border-top:1px solid var(--ln)}.det.open{display:block}.det p{margin:6px 0}
.lbl,.sr{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;padding:0 14px}
.lbl{color:var(--mu);font-size:11px;margin-top:4px;text-transform:uppercase;letter-spacing:.08em}.sr{margin-top:7px;border-radius:12px}
.sn{font:700 13px 'Chakra Petch';color:var(--mu);text-align:center}.sr.d .sn{color:var(--ac)}
.sr.d input{border-color:color-mix(in srgb,var(--ac) 55%,var(--ln));background:color-mix(in srgb,var(--ac) 10%,var(--sf2))}
.sr.wu input{height:38px;font-size:15px;opacity:.9}.sr.wu{grid-template-columns:28px 1fr 1fr 44px}
.sets{padding-bottom:6px}

.cfoot{display:flex;justify-content:space-between;padding:4px 10px 8px}.lnk{background:none;border:0;color:var(--ac);font:600 13px Inter;cursor:pointer;padding:10px 6px;border-radius:8px}

.fes{display:grid;gap:8px;margin-top:12px}.fe{display:flex;align-items:center;gap:8px}.fe>span{width:88px;font-size:13px;color:var(--mu)}.fe div{display:flex;gap:6px;flex:1}
.fe button{flex:1;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--sf2);color:var(--mu);font:600 14px 'Chakra Petch';cursor:pointer}.fe button.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.ghost{display:block;width:100%;background:none;border:1px dashed var(--ln2);color:var(--mu);border-radius:14px;padding:13px;font:600 14px Inter;cursor:pointer;margin:2px 0 12px}.ghost:hover{color:var(--tx);border-color:var(--mu)}

.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.filters input{flex:1;min-width:140px}
.pills{display:flex;gap:6px}.pills button{border:1px solid var(--ln);background:var(--sf);color:var(--mu);border-radius:99px;padding:0 14px;height:44px;font:600 13px Inter;cursor:pointer}.pills button.on{background:var(--sf3);color:var(--tx);border-color:var(--ln2)}

.dbx{width:46px;height:50px;border-radius:12px;background:color-mix(in srgb,var(--ac) 16%,var(--sf2));border:1px solid color-mix(in srgb,var(--ac) 40%,var(--ln));display:grid;place-items:center;text-align:center;line-height:1;flex:none}.dbx b{font-size:19px}.dbx small{display:block;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

.sps{display:flex;flex-wrap:wrap;gap:6px}.sp{font-size:13px;border:1px solid var(--ln);border-radius:10px;padding:4px 9px;color:var(--tx);display:inline-flex;gap:5px;align-items:center}.sp.dn{background:color-mix(in srgb,var(--ac) 14%,transparent);border-color:color-mix(in srgb,var(--ac) 45%,var(--ln))}.sp.pe{color:var(--mu);border-style:dashed}.sp .ic{width:13px;height:13px;stroke-width:3;color:var(--ac)}.sp .tr{color:var(--am)}
.sd .l{color:var(--mu);font-size:13px}.up{color:var(--gn);font:500 12px Inter}.dnn{color:var(--dgr);font:500 12px Inter}.same{color:var(--mu);font:500 12px Inter}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.btn.pri{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}.btn.amb{background:var(--am);color:var(--onam);border-color:var(--am)}.btn.danger{background:none;border-color:color-mix(in srgb,var(--dgr) 45%,transparent);color:var(--dgr)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}

.chart{width:100%;height:auto;display:block;overflow:visible}.chart text{fill:var(--mu);font-size:9px}.chart .gl{stroke:var(--ln);stroke-width:1}.chart .bar{fill:url(#gb)}.chart .ln{fill:none;stroke:var(--brand);stroke-width:2.2;stroke-linejoin:round}.chart .ar{fill:url(#ga)}.chart circle{fill:var(--bg);stroke:var(--brand);stroke-width:2}.chart circle.last{fill:var(--brand)}
.sel{display:flex;gap:8px;margin-bottom:10px}.sel select{flex:1}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px}td.r,th.r{text-align:right}tr:last-child td{border-bottom:0}td:first-child,th:first-child{white-space:normal;min-width:110px}td .meta{font-size:11px}.hst span:empty{display:none}
tr.go{cursor:pointer}.newb{font:700 10px Inter;color:var(--onam);background:var(--am);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.bar2{height:6px;background:var(--sf3);border-radius:3px;overflow:hidden;min-width:60px}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--brand))}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:12px}.box h2{font-size:18px;color:var(--brand);margin-bottom:6px}.box ul{margin:6px 0 0;padding-left:18px}.box li{margin:4px 0}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}.kv span:nth-child(odd){color:var(--mu)}
code,pre{font:12px ui-monospace,monospace;background:var(--sf2);border-radius:8px}pre{padding:10px;overflow:auto;margin:6px 0}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
/* nav */

#timer{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;max-width:620px;margin:0 auto;background:color-mix(in srgb,var(--sf) 97%,transparent);border:1px solid var(--brand);border-radius:16px;display:none;align-items:center;gap:10px;padding:8px 10px 10px;overflow:hidden;box-shadow:0 12px 40px var(--shd)}

.mb h2{font-size:21px;margin-bottom:8px}.mb p{margin:6px 0;color:var(--dim)}

/* editor */
#editor{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}#editor.on{display:flex}
.ed-bar{border-bottom:2px solid var(--am);background:color-mix(in srgb,var(--am) 14%,var(--bg));padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}

<div class="box"><h2>Choosing starting weights</h2><p>Your old numbers (deadlift 120 kg, machine squat 180 kg, bench 50 kg) are a ceiling, not your current level. In week 1 pick a load you could lift for about 6 more reps than the target. Roughly 50% of your old numbers is a sensible start. Week 1 should feel too easy.</p></div>

 o.pct=+s.pct||0;o.setsDone=+s.setsDone||0;o.setsPlanned=+s.setsPlanned||0;o.volume=num(s.volume);o.notes=String(s.notes||"");
 o.ex=s.ex.filter(e=>e&&typeof e=="object").map(e=>({...e,name:String(e.name==null?"":e.name),planned:+e.planned||0,sets:(Array.isArray(e.sets)?e.sets:[]).filter(x=>x&&typeof x=="object").map(x=>({...x,n:+x.n||0,w:num(x.w),r:num(x.r),d:!!x.d}))}));

const WK=(w,d)=>w+"-"+d;
function slots(w,d){
 const c=obj(A.cust[WK(w,d)]),rm=new Set(c.rm||[]),np=obj(c.np);
 let L=EX[d].map((e,i)=>({id:""+i,name:A.sub[d+"-"+i]||e[0],base:e[0],sub:!!A.sub[d+"-"+i],planned:np[i]!=null?np[i]:nSets(e,w),rng:e[2],rest:e[3],mus:e[4],start:e[5],how:e[6],alt:e[7],g:GR[d][i],tpl:1}));
 (c.add||[]).forEach(a=>L.push({id:a.id,name:a.name,base:a.name,planned:np[a.id]!=null?np[a.id]:a.planned,rng:a.rng||"—",rest:a.rest||90,mus:"Custom exercise",alt:"",g:a.g||NG[a.name]||"Other",tpl:0}));
 L=L.filter(x=>!rm.has(x.id));
 if(c.order){const ix=id=>{const k=c.order.indexOf(id);return k<0?999:k};L=L.map((x,j)=>[x,j]).sort((a,b)=>ix(a[0].id)-ix(b[0].id)||a[1]-b[1]).map(x=>x[0])}
 return L}
function removedSlots(w,d){const rm=new Set(obj(A.cust[WK(w,d)]).rm||[]);return EX[d].map((e,i)=>({id:""+i,name:A.sub[d+"-"+i]||e[0]})).filter(x=>rm.has(x.id))}

const sorted=()=>[...H].sort((a,b)=>b.ts-a.ts);
const doneSets=(s,n)=>{const e=s.ex.find(x=>x.name==n);return e?e.sets.filter(x=>x.d):[]};

/* recalculation (same formula the tracker has always used) */
function recalc(ex,omit){let d=0,p=0,v=0,ok=false;ex.forEach(e=>{p+=Math.max(+e.planned||0,e.sets.length);e.sets.forEach(x=>{if(x.d){d++;const a=num(x.w),b=num(x.r);if(a!=null&&b!=null){v+=a*b;ok=true}}})});
 p+=omit||0;return{setsDone:d,setsPlanned:p,pct:p?Math.round(d/p*100):0,volume:ok?Math.round(v):null}}

/* personal records, derived from history so edits/imports always stay consistent */
function prData(){const rec={},flags={};
 [...H].sort((a,b)=>a.ts-b.ts).forEach(s=>s.ex.forEach((e,ei)=>{
  const ds=e.sets.map((x,i)=>({w:x.w,r:x.r,d:x.d,i})).filter(x=>x.d&&x.w>0&&x.r>0);if(!ds.length)return;
  let bw=ds[0],br=ds[0];ds.forEach(x=>{if(x.w>bw.w||(x.w==bw.w&&x.r>bw.r))bw=x;if(x.r>br.r||(x.r==br.r&&x.w>br.w))br=x});
  const R=rec[e.name]=rec[e.name]||{},F=flags[s.id+"|"+ei]={};
  if(!R.w)R.w={w:bw.w,r:bw.r,ts:s.ts,id:s.id};
  else if(bw.w>R.w.w){F[bw.i]="w";R.w={w:bw.w,r:bw.r,ts:s.ts,id:s.id}}
  else if(bw.w==R.w.w&&bw.r>R.w.r){F[bw.i]=F[bw.i]||"r";R.w={w:bw.w,r:bw.r,ts:s.ts,id:s.id}}
  if(!R.r)R.r={w:br.w,r:br.r,ts:s.ts,id:s.id};
  else if(br.r>R.r.r&&br.w>=R.r.w){F[br.i]=F[br.i]||"r";R.r={w:br.w,r:br.r,ts:s.ts,id:s.id}}
  if(!/carry|plank|hold|hang/i.test(e.name)){let be=null;ds.forEach(x=>{if(x.r<=12){const v=x.w*(1+x.r/30);if(!be||v>be.v)be={v,w:x.w,r:x.r}}});
   if(be&&(!R.e||be.v>R.e.v))R.e={...be,ts:s.ts,id:s.id}}}));
 return{rec,flags}}
