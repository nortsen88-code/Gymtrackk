<div class="box"><h2>Choosing starting weights</h2><p>Your old numbers (deadlift 120 kg, machine squat 180 kg, bench 50 kg) are a ceiling, not your current level. In week 1 pick a load you could lift for about 6 more reps than the target. Roughly 50% of your old numbers is a sensible start. Week 1 should feel too easy.</p></div>
<div class="box"><h2>Progression: double progression</h2><ul><li>Work inside the rep range. When every set hits the top of the range with good form and the target effort, add weight next session.</li><li>Jumps: 2.5 kg for presses and curls, 5 kg for rows, pulldowns and leg press, 1–2 kg for lateral raises (or add reps first).</li><li>If reps drop below the bottom of the range, keep the weight until you recover the reps.</li><li>Stalled for 2–3 weeks? Check sleep and food before changing the program.</li></ul></div>
<div class="box"><h2>How hard to train</h2><p>Weeks 1–3: stop with 3–4 reps left. Weeks 4–5: about 3 left. Weeks 6–11: 1–3 left on compounds, 0–1 on the last set of isolations. Don’t grind failed reps on presses, and use clear form on every rep.</p></div>
<div class="box"><h2>Wrist protection</h2><ul><li>Use neutral-grip dumbbells and machines for pressing. Keep wrists stacked over forearms.</li><li>Warm up with 1–2 light sets of the first press.</li><li>Sharp, pinching or lingering wrist pain means stop that exercise, switch to the alternative, and see a physio if it persists. Never push through it.</li></ul></div>
<div class="box"><h2>Recovery and deloads</h2><ul><li>You may need more recovery if: weights fall for 2 sessions in a row, joints ache, sleep is poor, motivation is low, or resting heart rate is up.</li><li>Planned deload: week 12 (and every 6th week after). Cut sets in half and loads to about 60%.</li><li>Unplanned deload: if several of the signs above show up, take a 3–5 day break or do a light week.</li></ul></div>
